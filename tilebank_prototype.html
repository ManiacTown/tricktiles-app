<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tilebank — Daily Word Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --felt: #24402F;
    --felt-deep: #16261B;
    --tile: #F1E8D6;
    --tile-edge: #C9B896;
    --tile-shadow: #8a7a5c;
    --wood: #6B4429;
    --wood-dark: #4A2E1B;
    --ink: #241C14;
    --amber: #D9A441;
    --amber-bright: #F0BE5E;
    --invalid: #C1503F;
    --incomplete: #8a8060;
    --paper: #EFE7D6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #2c4c37 0%, var(--felt-deep) 100%);
    font-family: 'Inter', sans-serif;
    color: var(--paper);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 12px 40px;
  }
  .stamp { font-family: 'Special Elite', monospace; }

  header {
    width: 100%;
    max-width: 620px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 2px;
    margin: 0;
    color: var(--amber-bright);
  }
  .subtitle {
    font-size: 11px;
    letter-spacing: 3px;
    opacity: 0.55;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .hud {
    display: flex;
    gap: 18px;
    max-width: 620px;
    width: 100%;
    margin: 14px 0 18px;
  }
  .hud-item {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(217,164,65,0.25);
    border-radius: 8px;
    padding: 8px 16px;
    flex: 1;
    text-align: center;
  }
  .hud-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.6;
  }
  .hud-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--amber-bright);
    margin-top: 2px;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(13, minmax(0,1fr));
    gap: 3px;
    background: var(--felt);
    padding: 10px;
    border-radius: 10px;
    box-shadow: inset 0 2px 12px rgba(0,0,0,0.4), 0 12px 30px rgba(0,0,0,0.35);
    width: 100%;
    max-width: 620px;
  }
  .cell {
    aspect-ratio: 1/1;
    background: rgba(255,255,255,0.04);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .cell.dragover { background: rgba(217,164,65,0.25); }

  .tile {
    width: 92%;
    height: 92%;
    background: linear-gradient(145deg, var(--tile), #e5d8bc);
    border-radius: 4px;
    box-shadow: 0 2px 0 var(--tile-shadow), 0 4px 6px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: grab;
    color: var(--ink);
    font-family: 'Special Elite', monospace;
    font-size: clamp(12px, 3.4vw, 18px);
    user-select: none;
    transition: box-shadow 0.25s, transform 0.15s;
  }
  .tile:active { cursor: grabbing; }
  .tile .pts {
    position: absolute;
    bottom: 2px;
    right: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 7px;
    font-weight: 700;
    opacity: 0.55;
  }
  .tile.valid { box-shadow: 0 0 0 2px var(--amber) inset, 0 2px 0 var(--tile-shadow), 0 4px 6px rgba(0,0,0,0.35); }
  .tile.invalid { box-shadow: 0 0 0 2px var(--invalid) inset, 0 2px 0 var(--tile-shadow), 0 4px 6px rgba(0,0,0,0.35); }
  .tile.incomplete { box-shadow: 0 0 0 2px var(--incomplete) inset, 0 2px 0 var(--tile-shadow), 0 4px 6px rgba(0,0,0,0.35); opacity: 0.85; }
  .tile.ripple { animation: ripple 0.5s ease-out; }
  @keyframes ripple {
    0% { transform: scale(1); }
    40% { transform: scale(1.12); box-shadow: 0 0 12px 2px var(--amber-bright); }
    100% { transform: scale(1); }
  }

  #rackWrap {
    width: 100%;
    max-width: 620px;
    margin-top: 18px;
  }
  #rackLabel {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 6px;
  }
  #rack {
    background: linear-gradient(180deg, var(--wood), var(--wood-dark));
    border-radius: 10px;
    padding: 10px;
    min-height: 74px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.4), 0 6px 14px rgba(0,0,0,0.3);
  }
  #rack.dragover { background: linear-gradient(180deg, #7c5233, #5a3620); }
  #rack .tile { width: 46px; height: 46px; flex-shrink: 0; }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    width: 100%;
    max-width: 620px;
  }
  button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  button:active { transform: scale(0.97); }
  #shuffleBtn {
    background: rgba(255,255,255,0.08);
    color: var(--paper);
    border: 1px solid rgba(255,255,255,0.15);
  }
  #nextBtn {
    background: var(--amber);
    color: #241C14;
    flex: 1;
    opacity: 0.4;
    pointer-events: none;
  }
  #nextBtn.ready {
    opacity: 1;
    pointer-events: auto;
    box-shadow: 0 0 16px rgba(217,164,65,0.5);
  }

  .status {
    font-size: 12px;
    text-align: center;
    margin-top: 10px;
    min-height: 16px;
    opacity: 0.7;
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,16,12,0.88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  .card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 14px;
    padding: 32px 28px;
    text-align: center;
    max-width: 340px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .card h2 { margin: 0 0 4px; font-family: 'Special Elite', monospace; letter-spacing: 1px; }
  .card .big { font-size: 34px; font-weight: 800; color: #7a5a1e; margin: 14px 0 2px; }
  .card .small { font-size: 11px; opacity: 0.6; letter-spacing: 1px; text-transform: uppercase; }
  .card button { margin-top: 20px; background: var(--felt); color: var(--paper); width: 100%; }
</style>
</head>
<body>

<header>
  <div>
    <h1 class="stamp">TILEBANK</h1>
    <div class="subtitle">Prototype · Core Loop Demo</div>
  </div>
</header>

<div class="hud">
  <div class="hud-item"><div class="hud-label">Round</div><div class="hud-value" id="roundVal">1 / 5</div></div>
  <div class="hud-item"><div class="hud-label">Time</div><div class="hud-value" id="timeVal">0:00</div></div>
  <div class="hud-item"><div class="hud-label">Score</div><div class="hud-value" id="scoreVal">0</div></div>
</div>

<div id="board"></div>

<div id="rackWrap">
  <div id="rackLabel">Your Tiles — drag onto the board</div>
  <div id="rack"></div>
</div>

<div class="controls">
  <button id="shuffleBtn">Shuffle Rack</button>
  <button id="nextBtn">Complete Round →</button>
</div>
<div class="status" id="statusMsg">Drag tiles onto the board to build words.</div>

<div id="overlay">
  <div class="card">
    <h2 class="stamp">FINISHED!</h2>
    <div class="small">Total Time</div>
    <div class="big" id="finalTime">0:00</div>
    <div class="small">Score</div>
    <div class="big" id="finalScore">0</div>
    <button id="playAgainBtn">Play Again</button>
  </div>
</div>

let score = 0;
let startTime = null;
let timerInterval = null;
let dragged = null; // {tileId, from: 'rack'|'board', r, c}

function newTileId() { return 't' + (tileIdSeed++); }

function dealTiles(n) {
  const out = [];
  const pool = [...BAG_POOL];
  for (let i = 0; i < n; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    out.push({ id: newTileId(), letter: pool[idx] });
  }
  return out;
}

function startTimer() {
  if (timerInterval) return;
  startTime = Date.now();
  timerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('timeVal').textContent = formatTime(s);
  }, 250);
}
function stopTimer() { clearInterval(timerInterval); timerInterval = null; }
function formatTime(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  return m + ':' + String(sec).padStart(2, '0');
}

function renderBoard() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r; cell.dataset.c = c;
      cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('dragover'); });
      cell.addEventListener('dragleave', () => cell.classList.remove('dragover'));
      cell.addEventListener('drop', e => { e.preventDefault(); cell.classList.remove('dragover'); onDropCell(r, c); });
      const t = board[r][c];
      if (t) cell.appendChild(makeTileEl(t, 'board', r, c));
      el.appendChild(cell);
    }
  }
}

function renderRack() {
  const el = document.getElementById('rack');
  el.innerHTML = '';
  rack.forEach(t => el.appendChild(makeTileEl(t, 'rack')));
}

function makeTileEl(tileObj, from, r, c) {
  const d = document.createElement('div');
  d.className = 'tile';
  d.draggable = true;
  d.dataset.tileId = tileObj.id;
  d.innerHTML = tileObj.letter + '<span class="pts">' + VALUES[tileObj.letter] + '</span>';
  d.addEventListener('dragstart', e => {
    dragged = { tileId: tileObj.id, from, r, c };
    e.dataTransfer.effectAllowed = 'move';
  });
  return d;
}

function onDropCell(r, c) {
  if (!dragged) return;
  if (board[r][c]) { dragged = null; return; } // occupied
  const tile = findDraggedTile();
  if (!tile) return;
  if (dragged.from === 'rack') {
    rack = rack.filter(t => t.id !== dragged.tileId);
  } else {
    board[dragged.r][dragged.c] = null;
  }
  board[r][c] = tile;
  dragged = null;
  afterMove();
}

document.getElementById('rack').addEventListener('dragover', e => {
  e.preventDefault();
  document.getElementById('rack').classList.add('dragover');
});
document.getElementById('rack').addEventListener('dragleave', () => {
  document.getElementById('rack').classList.remove('dragover');
});
document.getElementById('rack').addEventListener('drop', e => {
  e.preventDefault();
  document.getElementById('rack').classList.remove('dragover');
  if (!dragged || dragged.from !== 'board') { dragged = null; return; }
  const tile = board[dragged.r][dragged.c];
  if (!tile) return;
  board[dragged.r][dragged.c] = null;
  rack.push(tile);
  dragged = null;
  afterMove();
});

function findDraggedTile() {
  if (dragged.from === 'rack') return rack.find(t => t.id === dragged.tileId);
  return board[dragged.r][dragged.c];
}

function afterMove() {
  if (rack.length < DEALS.slice(0, round).reduce((a,b)=>a+b,0) + 1 && startTime === null) startTimer();
  renderBoard();
  renderRack();
  validate();
}

// returns runs: array of {cells: [[r,c],...], word: str}
function getRuns() {
  const runs = [];
  // horizontal
  for (let r = 0; r < ROWS; r++) {
    let run = [];
    for (let c = 0; c <= COLS; c++) {
      const t = c < COLS ? board[r][c] : null;
      if (t) run.push([r, c]);
      else {
        if (run.length >= 2) runs.push({ cells: run.slice(), word: run.map(([rr,cc])=>board[rr][cc].letter).join('') });
        run = [];
      }
    }
  }
  // vertical
  for (let c = 0; c < COLS; c++) {
    let run = [];
    for (let r = 0; r <= ROWS; r++) {
      const t = r < ROWS ? board[r][c] : null;
      if (t) run.push([r, c]);
      else {
        if (run.length >= 2) runs.push({ cells: run.slice(), word: run.map(([rr,cc])=>board[rr][cc].letter).join('') });
        run = [];
      }
    }
  }
  return runs;
}

function validate() {
  const runs = getRuns();
  const cellStatus = {}; // "r,c" -> 'valid'|'invalid'
  const inRun = new Set();
  let allValid = true;
  runs.forEach(run => {
    const ok = WORDS.has(run.word);
    if (!ok) allValid = false;
    run.cells.forEach(([r,c]) => {
      const key = r+','+c;
      inRun.add(key);
      if (cellStatus[key] !== 'invalid') cellStatus[key] = ok ? 'valid' : 'invalid';
    });
  });

  // apply classes + detect isolated tiles
  let hasIsolated = false;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = board[r][c];
      if (!t) continue;
      const key = r+','+c;
      const cellEl = document.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"] .tile');
      if (!cellEl) continue;
      cellEl.classList.remove('valid','invalid','incomplete');
      if (cellStatus[key] === 'valid') cellEl.classList.add('valid');
      else if (cellStatus[key] === 'invalid') cellEl.classList.add('invalid');
      else { cellEl.classList.add('incomplete'); hasIsolated = true; }
    }
  }

  const boardHasTiles = board.some(row => row.some(t => t));
  const complete = boardHasTiles && rack.length === 0 && allValid && !hasIsolated;

  const nextBtn = document.getElementById('nextBtn');
  const statusEl = document.getElementById('statusMsg');
  if (complete) {
    nextBtn.classList.add('ready');
    statusEl.textContent = round < ROUNDS ? 'All tiles placed! Ready for the next round.' : 'Board complete — finish the game!';
  } else {
    nextBtn.classList.remove('ready');
    if (rack.length > 0) statusEl.textContent = rack.length + ' tile' + (rack.length===1?'':'s') + ' left to place.';
    else if (hasIsolated) statusEl.textContent = 'Every tile needs to be part of a word (2+ letters).';
    else if (!allValid) statusEl.textContent = 'Some letters don\'t form a valid word.';
    else statusEl.textContent = '';
  }

  // live score = sum of values of tiles currently in valid runs
  let liveScore = 0;
  runs.forEach(run => {
    if (WORDS.has(run.word)) {
      liveScore += run.cells.reduce((sum,[r,c]) => sum + VALUES[board[r][c].letter], 0);
    }
  });
  score = liveScore;
  document.getElementById('scoreVal').textContent = score;

  return complete;
}

function rippleValidWords() {
  document.querySelectorAll('.tile.valid').forEach(el => {
    el.classList.add('ripple');
    setTimeout(() => el.classList.remove('ripple'), 500);
  });
}

document.getElementById('shuffleBtn').addEventListener('click', () => {
  for (let i = rack.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [rack[i], rack[j]] = [rack[j], rack[i]];
  }
  renderRack();
});

document.getElementById('nextBtn').addEventListener('click', () => {
  if (!document.getElementById('nextBtn').classList.contains('ready')) return;
  rippleValidWords();
  round++;
  document.getElementById('roundVal').textContent = Math.min(round+1, ROUNDS) + ' / ' + ROUNDS;
  if (round >= ROUNDS) {
    setTimeout(finishGame, 550);
    return;
  }
  setTimeout(() => {
    rack = rack.concat(dealTiles(DEALS[round]));
    renderRack();
    validate();
  }, 550);
});

function finishGame() {
  stopTimer();
  const s = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById('finalTime').textContent = formatTime(s);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('overlay').classList.add('show');
}

document.getElementById('playAgainBtn').addEventListener('click', () => initGame());

function initGame() {
  board = Array.from({length: ROWS}, () => Array(COLS).fill(null));
  round = 0;
  score = 0;
  startTime = null;
  stopTimer();
  document.getElementById('timeVal').textContent = '0:00';
  document.getElementById('roundVal').textContent = '1 / ' + ROUNDS;
  document.getElementById('scoreVal').textContent = '0';
  document.getElementById('overlay').classList.remove('show');
  rack = dealTiles(DEALS[0]);
  renderBoard();
  renderRack();
  validate();
}

initGame();
</script>
